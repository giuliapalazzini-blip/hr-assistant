[tool.poetry]
name = "hr-assistant"
version = "0.1.0"
description = "HR Assistant Application"
authors = ["Giulia Palazzini <giuliapalazzini@outlook.it>"]
readme = "README.md"
packages = [{include = "hr_assistant", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
python-dotenv = "^1.0.0"
openai = "^2.0.0"
langchain = "^1.0.0"
chromadb = "^1.0.0"
chainlit = "^2.11.1"
langchain-openai = "^1.0.0"
scikit-learn = "^1.0.0"
numpy = "^2.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"