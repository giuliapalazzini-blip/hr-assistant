[project]
name = "hr-assistant"
version = "0.1.0"
description = ""
authors = [
    {name = "Giulia Palazzini",email = "giuliapalazzini@outlook.it"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14.0"
dependencies = [
    "python-dotenv (>=1.2.2,<2.0.0)",
    "openai (>=2.48.0,<3.0.0)",
    "langchain (>=1.3.14,<2.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "chainlit (>=2.11.1,<3.0.0)",
    "langchain-openai (>=1.4.1,<2.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "numpy (>=2.5.1,<3.0.0)"
]

[tool.poetry]
packages = [{include = "hr_assistant", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
